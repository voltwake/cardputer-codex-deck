name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install build tools
        run: |
          ./scripts/bootstrap.sh
      - name: Check public project contract
        run: python3 tools/check_project.py
      - name: Check generated versions
        run: python3 tools/generate_versions.py --check
      - name: Check patches and syntax
        run: |
          git diff --check
          PYTHONPATH=bridge:. bridge/.venv/bin/python -m compileall -q bridge tools
      - name: Secret scan
        run: ./scripts/security-scan.sh
      - name: Python tests
        run: PYTHONPATH=bridge:. bridge/.venv/bin/python -m unittest discover -s bridge/tests -v
      - name: Swift tests
        run: swift test --package-path macos
      - name: Firmware build
        run: tools/.venv/bin/pio run
      - name: Package app and Agent
        run: macos/scripts/build_app.sh
      - name: Validate package
        run: python3 tools/validate_release.py --app macos/dist/CardBridge.app
