[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardbridge"
dynamic = ["version"]
description = "Internal bridge agent for the Codex Deck Cardputer ADV companion"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "sounddevice>=0.4.6",
  "zeroconf>=0.131",
  "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Security>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
cardbridge = "cardbridge.__main__:main"

[tool.setuptools]
py-modules = ["fake_device"]

[tool.setuptools.dynamic]
version = {attr = "cardbridge.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["cardbridge*"]
