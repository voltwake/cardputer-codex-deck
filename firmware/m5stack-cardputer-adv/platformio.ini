; M5Stack Cardputer (ESP32-S3 / StampS3)
; PlatformIO project — Codex Deck wireless microphone/keyboard firmware

[env:cardputer]
; pioarduino platform pinned to Arduino 3.2.1 / ESP-IDF 5.4.2.
; IDF 5.5.x has a confirmed regression in ESP32-S3 MCLK routing that makes the
; ES8311 ADC output constant DC (silent mic) — espressif/esp-idf#18621. IDF
; 5.4.2 is the version M5's own fix pins to (uiflow-micropython#97). The stock
; espressif32 platform (Arduino 2.x / IDF 4.4) is too old for the ADV mic path.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino

; Keep the generated anti-aliased Chinese font as a compact binary asset.
; PlatformIO exposes linker start/end symbols consumed by ui_font_data.h.
board_build.embed_files =
    assets/fonts/cardbridge-ui-13.bff

; Native USB-Serial/JTAG is what shows up as /dev/cu.usbmodem*
monitor_speed = 115200
; No explicit port: PlatformIO auto-detects the single connected device.
; (The name changes with the physical USB port: usbmodem101 / usbmodem1401 / ...)
; NO PSRAM on the Cardputer ADV (Stamp-S3A / ESP32-S3FN8).
; Verified empirically 2026-07-13: both qio_qspi and qio_opi read PSRAM ID
; 0x00000000 ("chip not found"), and the official spec table lists no PSRAM.
; Third-party articles claiming 8MB PSRAM are wrong. RAM budget = 512KB SRAM.

; Route Arduino Serial to the native USB CDC so prints appear on the monitor
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Cardputer @ 1.1.1
    ; JSON line protocol parsing/serialization. Fixed-size documents are used
    ; in firmware so this does not introduce unbounded heap growth.
    bblanchon/ArduinoJson @ 6.21.5
